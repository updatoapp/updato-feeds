name: Fetch news feeds

on:
  schedule:
    # Hourly, at minute 0 (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Allow the job to push the regenerated feed files back to the repo.
permissions:
  contents: write

# Never let two runs push at the same time.
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build feeds
        env:
          RECENT_MINUTES: "90"
          MAX_PER_SITEMAP: "50"
          MAX_PER_FEED: "500"
          RETENTION_DAYS: "7"
          MAX_WORKERS: "16"
        run: python scripts/fetch_feeds.py

      - name: Commit & push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore(feeds): hourly refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
