name: Fetch news feeds

on:
  schedule:
    # ~30-min refresh, quiet overnight IST (23:00–04:00).
    # IST = UTC+5:30. Allowed window ≈ 04:25–22:55 IST:
    #   22:55 UTC → 04:25 IST (first after quiet)
    #   23:25–16:55 UTC → 04:55–22:25 IST
    #   17:25 UTC → 22:55 IST (last before 23:00 IST)
    # Deliberately OFF minute 0 — GitHub deprioritizes top-of-hour crons.
    - cron: "55 22 * * *"
    - cron: "25,55 0-16,23 * * *"
    - cron: "25 17 * * *"
  workflow_dispatch: {}

# Allow the job to push the regenerated feed files back to the repo.
permissions:
  contents: write

# Never let two runs push at the same time.
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build feeds
        env:
          RECENT_MINUTES: "90"
          MAX_PER_SITEMAP: "50"
          MAX_PER_FEED: "2000"
          RETENTION_DAYS: "7"
          MAX_WORKERS: "16"
          # Hard-drop these categories from the swipe feed (comma list).
          # Daily राशिफल is multi-publisher so ranking alone would promote it.
          # Add more to turn a category off, e.g. "astrology,lifestyle,food"
          # Set to "" (empty) to disable exclusions.
          EXCLUDED_CATEGORIES: "astrology,horoscope,rashifal,panchang,jyotish"
        run: python scripts/fetch_feeds.py

      # Primary CDN: Cloudflare R2 (set-and-forget). Pages git commit below stays as fallback.
      - name: Upload feeds to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::R2 secrets missing — skipping upload (Pages fallback only)."
            exit 0
          fi
          BUCKET="${R2_BUCKET:-updato-feeds}"
          pip install --quiet awscli
          aws s3 sync feeds/ "s3://${BUCKET}/feeds/" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/gzip" \
            --cache-control "public, max-age=120" \
            --exclude "*" --include "*.json.gz"

      - name: Commit & push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "chore(feeds): hourly refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
