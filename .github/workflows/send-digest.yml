name: Send news digest

on:
  schedule:
    # Cron is UTC (IST = UTC + 5:30). Minutes are deliberately OFF the top of
    # the hour — GitHub drops congested minute-0 scheduled runs under load.
    - cron: "37 2 * * *"    # 08:07 IST  -> morning
    - cron: "37 7 * * *"    # 13:07 IST  -> afternoon
    - cron: "37 12 * * *"   # 18:07 IST  -> evening
    - cron: "7 16 * * *"    # 21:37 IST  -> night
  workflow_dispatch:
    inputs:
      slot:
        description: "Which digest to send"
        type: choice
        default: auto
        options: [auto, morning, afternoon, evening, night]
      langs:
        description: "Comma list of languages (blank = all)"
        required: false
        default: ""
      ranking:
        description: "Rank by importance (uncheck for pure recency)"
        type: boolean
        default: true
      min_sources:
        description: "Min publishers per story (blank = 1)"
        required: false
        default: ""
      dry_run:
        description: "Build & log only, do not send"
        type: boolean
        default: false

# The digest send reads the repo and uploads baked images to R2 (no git push).
permissions:
  contents: read

concurrency:
  group: send-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/notify_requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/notify_requirements.txt

      - name: Write service account key
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FCM_SERVICE_ACCOUNT secret."
            exit 1
          fi
          printf '%s' "$FCM_SERVICE_ACCOUNT" > service_account.json

      - name: Send digest
        env:
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
          LANGS: ${{ github.event.inputs.langs }}
          RANKING: ${{ github.event.inputs.ranking == 'false' && '0' || '' }}
          MIN_SOURCES: ${{ github.event.inputs.min_sources }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          SERVICE_ACCOUNT_FILE: service_account.json
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BAKE_NOTIF_IMAGE: "0"
        run: |
          # Fall back to the default language list when the input is blank.
          if [ -z "$LANGS" ]; then unset LANGS; fi
          # Prefer R2 public CDN when secret is set (e.g. https://pub-xxx.r2.dev).
          if [ -n "$R2_PUBLIC_BASE" ]; then
            export FEED_BASE_URL="${R2_PUBLIC_BASE%/}/feeds"
          fi
          python scripts/send_digest.py

      - name: Upload baked previews (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: notif-previews
          path: notif_previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up key
        if: always()
        run: rm -f service_account.json
